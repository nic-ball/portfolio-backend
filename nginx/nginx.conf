upstream django_prod { server web-prod:8000; }
upstream blog_prod { server blog-prod:3000; }

# --- 1. PROD API (api.nic-ball.co.uk) ---
server {
    listen 443 ssl;
    server_name api.nic-ball.co.uk;
    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    location / {
        proxy_pass http://django_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ { alias /home/app/web/staticfiles/; }
    location /media/ { alias /home/app/web/mediafiles/; }
}

# --- 2. BLOG (blog.nic-ball.co.uk) ---
server {
    listen 443 ssl;
    server_name blog.nic-ball.co.uk;
    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    location / {
        proxy_pass http://blog_prod;
        proxy_set_header Host $host;
    }
}

# --- 3. FRONTEND (portfolio.nic-ball.co.uk) ---
server {
    listen 443 ssl;
    server_name portfolio.nic-ball.co.uk nic-ball.co.uk;
    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    root /var/www/portfolio;
    index index.html;

    # React Router Fix: 
    # If the file isn't found, return index.html (React handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- 4. HTTP REDIRECT ---
server {
    listen 80;
    server_name api.nic-ball.co.uk blog.nic-ball.co.uk portfolio.nic-ball.co.uk nic-ball.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
