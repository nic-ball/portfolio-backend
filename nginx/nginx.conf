upstream api_prod {
    server web-prod:8000;
}

upstream api_test {
    server web-test:8000;
}

# =========================================================================
# 1. PROD API (HTTPS) - api.nic-ball.co.uk
# =========================================================================
server {
    listen 443 ssl;
    server_name api.nic-ball.co.uk;

    # SSL Config
    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow larger image uploads (10MB)
    client_max_body_size 10M;

    location / {
        proxy_pass http://api_prod;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https; # Tell Django we are secure
        proxy_redirect off;
    }

    # Serve Static & Media
    location /static/ { alias /home/app/web/staticfiles/; }
    location /media/ { alias /home/app/web/mediafiles/; }
}

# =========================================================================
# 2. TEST API (HTTPS) - test-api.nic-ball.co.uk
# =========================================================================
server {
    listen 443 ssl;
    server_name test-api.nic-ball.co.uk;

    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    location / {
        proxy_pass http://api_test;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
    location /static/ { alias /home/app/web/staticfiles/; }
}

# =========================================================================
# 3. FRONTEND (HTTPS) - portfolio.nic-ball.co.uk & Root
# =========================================================================
server {
    listen 443 ssl;
    server_name portfolio.nic-ball.co.uk nic-ball.co.uk;

    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    root /var/www/portfolio;
    index index.html;

    # Handle React Router (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =========================================================================
# 4. HTTP REDIRECT (Force HTTPS for everything)
# =========================================================================
server {
    listen 80;
    server_name api.nic-ball.co.uk test-api.nic-ball.co.uk portfolio.nic-ball.co.uk nic-ball.co.uk blog.nic-ball.co.uk;

    # Keep this open for Certbot renewals in the future
    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
upstream blog_prod {
    server blog-prod:3000; # Next.js runs on port 3000
}

# =========================================================================
# 5. BLOG (HTTPS) - blog.nic-ball.co.uk
# =========================================================================
server {
    listen 443 ssl;
    server_name blog.nic-ball.co.uk;

    ssl_certificate /etc/letsencrypt/live/api.nic-ball.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nic-ball.co.uk/privkey.pem;

    location / {
        proxy_pass http://blog_prod;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
