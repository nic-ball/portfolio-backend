# Define the groups of servers we want to talk to
upstream api_prod {
    server web-prod:8000;
}

upstream api_test {
    server web-test:8000;
}

# ------------------------------------------------------------
# 1. PROD API (api.nic-ball.co.uk)
# ------------------------------------------------------------
server {
    listen 80;
    server_name api.nic-ball.co.uk;

    # Allow larger image uploads (adjust as needed)
    client_max_body_size 10M;

    location / {
        proxy_pass http://api_prod;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve Static Files (CSS/JS) directly via Nginx
    # This matches the internal path inside the Nginx container
    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    # Serve Media Files (User Uploads)
    location /media/ {
        alias /home/app/web/mediafiles/;
    }
}

# ------------------------------------------------------------
# 2. TEST API (test-api.nic-ball.co.uk)
# ------------------------------------------------------------
server {
    listen 80;
    server_name test-api.nic-ball.co.uk;

    location / {
        proxy_pass http://api_test;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}

# ------------------------------------------------------------
# 3. FRONTEND (portfolio.nic-ball.co.uk + nic-ball.co.uk)
# ------------------------------------------------------------
server {
    listen 80;
    server_name portfolio.nic-ball.co.uk nic-ball.co.uk;

    root /var/www/portfolio;
    index index.html;

    # React Router support:
    # If a file isn't found, send index.html so React handles the route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
